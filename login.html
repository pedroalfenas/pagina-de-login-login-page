<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <form>
        <h1>Entrar</h1>

        <div class="campo-texto">
            <label for="email">Email:</label>
            <input id="email" type="email" required placeholder="digite aqui:">
        </div>

        <div class="campo-texto">
            <label for="senha">Senha:</label>
            <input id="senha" type="password" required placeholder="digite aqui:">
        </div>

        <button type="submit">
            <div class="texto-botao">
                Entrar
            </div>
            </button>

        <p> Não tem uma conta?
            <a href="#">Crie uma!</a>
        </p>
    </form>
</body>

</html>
